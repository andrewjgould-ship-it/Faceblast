<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: one arcade-cabinet column — the game screen, then a weapon rack and the controls */
:root{
  --bg:#0e0b0a; --panel:#1c1614; --edge:#3d2e26; --fg:#dccbb2; --muted:#8f7c67; --blood:#d0161c; --gold:#f2b632;
  --display:"Press Start 2P","Courier New",monospace; --body:"VT323","Courier New",monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:20px;line-height:1.2;padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px}
h1{font-family:var(--display);font-size:clamp(18px,4vw,28px);color:var(--blood);margin:0;letter-spacing:2px;text-shadow:3px 3px 0 #000;text-wrap:balance}
.tag{margin:0;color:var(--muted)}
.screen{border:4px solid var(--edge);background:#000;box-shadow:0 0 0 2px #000,0 10px 30px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:auto;aspect-ratio:320/200;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none;touch-action:none;background:#000}
.rack{display:grid;grid-template-columns:repeat(6,1fr) auto;gap:8px}
.rack button{font-family:var(--display);font-size:11px;background:var(--panel);color:var(--fg);border:3px solid var(--edge);padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-transform:uppercase}
.rack button .k{color:var(--muted)}
.rack button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.rack button[aria-pressed="true"] .k{color:var(--gold)}
.rack button:hover{background:#261d1a}
.rack button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rack .mute{color:var(--muted)}
.help{color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 22px;margin:0}
kbd{font-family:var(--display);font-size:9px;color:var(--fg);background:var(--panel);border:2px solid var(--edge);padding:2px 5px;margin-right:4px}
@media (max-width:760px){.rack{grid-template-columns:repeat(3,1fr)}.rack .mute{grid-column:1/-1}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>FACE BLAST</h1>
    <p class="tag">Three levels, a boss fight and twelve weapons.</p>
  </header>
  <div class="screen"><canvas id="game" width="640" height="400" aria-label="Face Blast game screen"></canvas></div>
  <div class="rack" role="group" aria-label="Weapons">
    <button type="button" data-gun="0" aria-pressed="true"><span class="k">1</span>Pistol</button>
    <button type="button" data-gun="1" aria-pressed="false"><span class="k">2</span>Shotgun</button>
    <button type="button" data-gun="2" aria-pressed="false"><span class="k">3</span>Rifle</button>
    <button type="button" data-gun="3" aria-pressed="false"><span class="k">4</span>Uzi</button>
    <button type="button" data-gun="4" aria-pressed="false"><span class="k">5</span>Rocket</button>
    <button type="button" data-gun="5" aria-pressed="false"><span class="k">6</span>Flamer</button>
    <button type="button" class="mute" id="mute" aria-pressed="false">Sound on</button>
  </div>
  <p class="help">
    <span><kbd>Click</kbd>shoot where you aim</span>
    <span><kbd>1</kbd>–<kbd>6</kbd>switch guns</span>
    <span>Hold the button for the Uzi, Flamer or Chainsaw</span>
    <span>Shoot the critters in the background for bonus points</span>
    <span>Level 3 swaps in a new set of weapons</span>
    <span><kbd>M</kbd>mute</span>
  </p>
</div>

const sh=(c,f)=>[clamp(c[0]*f,0,255),clamp(c[1]*f,0,255),clamp(c[2]*f,0,255)];

/* ---------- pixel buffer ---------- */
class PB{
  constructor(w,h){this.w=w;this.h=h;this.d=new Uint8ClampedArray(w*h*4)}
  i(x,y){return (y*this.w+x)*4}
  in(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h}
  set(x,y,c){x=Math.floor(x);y=Math.floor(y);if(!c||!this.in(x,y))return;const i=this.i(x,y);this.d[i]=c[0];this.d[i+1]=c[1];this.d[i+2]=c[2];this.d[i+3]=c[3]===undefined?255:c[3]}
  get(x,y){x=Math.floor(x);y=Math.floor(y);if(!this.in(x,y))return null;const i=this.i(x,y);return [this.d[i],this.d[i+1],this.d[i+2],this.d[i+3]]}
  a(x,y){x=Math.floor(x);y=Math.floor(y);return this.in(x,y)?this.d[this.i(x,y)+3]:0}
  ell(cx,cy,rx,ry,c,cond){
    for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry+1);y++)for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx+1);x++){
      const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;
      if(dx*dx+dy*dy<=1&&(!cond||cond(x,y))){this.set(x,y,typeof c==='function'?c(x,y,dx,dy):c)}
    }
  }
  rect(x,y,w,h,c,cond){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(!cond||cond(i,j))this.set(i,j,c)}
  line(x0,y0,x1,y1,c,t=1,cond){
    const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*1.5));
    for(let k=0;k<=n;k++){const u=k/n;const x=Math.round(x0+(x1-x0)*u-(t-1)/2),y=Math.round(y0+(y1-y0)*u-(t-1)/2);
      for(let a=0;a<t;a++)for(let b=0;b<t;b++)if(!cond||cond(x+a,y+b))this.set(x+a,y+b,typeof c==='function'?c(x+a,y+b):c)}
  }
  poly(pts,c){
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const [p,q] of pts){x0=Math.min(x0,p);x1=Math.max(x1,p);y0=Math.min(y0,q);y1=Math.max(y1,q)}
    for(let y=Math.floor(y0);y<=Math.ceil(y1);y++)for(let x=Math.floor(x0);x<=Math.ceil(x1);x++){
      const px=x+.5,py=y+.5;let ins=false;
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins}
      if(ins)this.set(x,y,typeof c==='function'?c(x,y):c)
    }
  }
}

function shapeFn(s,dx,dy){
  switch(s){
    case 'square':return dy<0?dx*dx+dy*dy<=1:dx**4+dy**4<=1;
    case 'pointy':{if(dy<0)return dx*dx+dy*dy<=1;if(dy>1)return false;return Math.abs(dx)<=Math.sqrt(1-dy*dy)*(1-.45*dy)}
    case 'skull':{if(dy<.2)return dx*dx+dy*dy<=1;if(dy>1)return false;return Math.abs(dx)<=.72*Math.sqrt(1-dy*dy)+.05}
    case 'wide':return Math.abs(dx)**3+Math.abs(dy)**3<=1;
    case 'blob':{const r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);return r<=1+.07*Math.sin(a*6)+.04*Math.sin(a*11)}
    default:return dx*dx+dy*dy<=1;
  }
}

    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function boom({lp=2000,dec=.2,vol=.5,thump=0,hp=0,dly=0}){
  if(!AC||muted)return;const t=AC.currentTime+dly;
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(lp,t);f.frequency.exponentialRampToValueAtTime(Math.max(60,lp*.15),t+dec);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);s.connect(f);let last=f;
  if(hp){const h=AC.createBiquadFilter();h.type='highpass';h.frequency.value=hp;f.connect(h);last=h}
  last.connect(g);g.connect(master);s.start(t,Math.random()*.4);s.stop(t+dec+.05);
  if(thump){const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(thump,t);o.frequency.exponentialRampToValueAtTime(30,t+dec);og.gain.setValueAtTime(vol*.9,t);og.gain.exponentialRampToValueAtTime(.001,t+dec);o.connect(og);og.connect(master);o.start(t);o.stop(t+dec+.05)}
}

  o.type='sawtooth';o.frequency.setValueAtTime(190-k*14,t);o.frequency.exponentialRampToValueAtTime(120-k*10,t+.13);f.type='lowpass';f.frequency.value=1100;

  if(f&&f.state==='live'){let hit=null;for(const [ox,oy] of [[0,0],[3,0],[-3,0],[0,3],[0,-3]]){const lx=Math.floor(x+ox-f.sx),ly=Math.floor(y+oy-f.sy);if(f.p.a(lx,ly)>0){hit=[lx,ly];break}}
    if(hit){const [lx,ly]=hit;charWound(f,lx,ly);f.burns.push({lx,ly,t:1.4});hitsLanded++;f.hits++;f.flinch=.08;
      for(let k=0;k<6;k++)addP({k:'drop',x,y,vx:rand(-40,40),vy:rand(-90,-30),g:260,life:3,s:1,c:pick(['#3a0000','#5e0000','#7d0404']),floor:rand(146,166)});
      mist(x,y-4,2,14,'#3a3430',.5,.9);boom({lp:500,dec:.15,vol:.25});if(f.hits>=f.hp)explode(f);return}}
  const ci=critterAt(x,y);if(ci>=0){hitsLanded++;killCritter(ci,true);return}
  if(y<VIEW_H&&y>=0){bgc.fillStyle='rgba(10,6,4,.35)';bgc.fillRect(Math.round(x)-2,Math.round(y)-1,4,3)}
}

function startGame(){score=0;totalKills=0;shotsFired=0;hitsLanded=0;critterKills=0;bossKilled=false;startLevel(0)}
function startLevel(n){
  const L=LEVELS[n];level=n;state='play';final=false;order=L.faces.slice().sort(()=>Math.random()-.5);if(L.boss)order.push(L.boss);idx=0;kills=0;levelCritters=0;
  P.length=0;emitters.length=0;splats.length=0;msgs.length=0;critters.length=0;rockets.length=0;pops.length=0;burnQ.length=0;throws.length=0;
  GUNS=L.melee?MELEE:GUNS_A;sprites=L.melee?SPR_B:SPR_A;cur=0;switchT=.3;setRack();syncRack();
  buildBg(L.theme);face=null;introT=2;spawnT=1.2;cooldown=.2;
}
function nextFace(){idx++;if(idx>=order.length){state='over';overT=0;face=null;final=level===LEVELS.length-1;return}
  face=buildFace(order[idx],LEVELS[level].hp);if(face.def.boss){msg('BOSS FIGHT!','#e0201a',16,40,2.2);boom({lp:200,dec:1.5,vol:.9,thump:40})}}
function switchGun(i){if(i===cur||i<0||i>=GUNS.length)return;cur=i;switchT=.3;cooldown=Math.max(cooldown,.15);syncRack();boom({lp:4000,hp:2000,dec:.05,vol:.2})}

function fire(){
  const g=GUNS[cur];if(state!=='play'||cooldown>0||switchT>0)return;
  cooldown=g.rate;recoil=1;
  if(g.melee){meleeFire(g);return}
  if(g.flame){flameShot();return}
  flashT=.06;shotsFired++;sfxGun[cur]();
  if(g.rocket){launchRocket();return}
  if(cur===1)pumpT=0;
  const f=face,live=f&&f.state==='live';let hit=false,hitCrit=false;
  for(let i=0;i<g.pellets;i++){const a=rand(0,TAU),r=Math.sqrt(Math.random())*g.spread,px=mouse.x+Math.cos(a)*r,py=mouse.y+Math.sin(a)*r;
    if(live){const lx=Math.floor(px-f.sx),ly=Math.floor(py-f.sy);if(f.p.a(lx,ly)>0){hit=true;wound(f,lx,ly,cur);hitFX(cur,px,py,lx,ly,f);continue}}
    const ci=critterAt(px,py);if(ci>=0){hitCrit=true;killCritter(ci,false);continue}
    miss(px,py)}
  if(cur===2)tracers.push({x0:muzzlePos[0],y0:muzzlePos[1],x1:mouse.x,y1:mouse.y,t:0});
  const shellCol=cur===1?'#b0201a':'#d9a932';
  addP({k:'shell',x:muzzlePos[0]+12,y:muzzlePos[1]+22,vx:rand(60,120),vy:rand(-170,-100),g:520,life:3,s:2,c:shellCol,floor:rand(158,166)});
  if(hit){hitsLanded++;f.hits++;f.flinch=.12;boom({lp:700,dec:.12,vol:.35});
    if(cur===1)mist(mouse.x,mouse.y,4,30,'#a01818',.45,.6);
    if(f.hits>=f.hp)explode(f)}
  else if(hitCrit)hitsLanded++;
}

/* melee weapons (level 3) */
function meleeFire(g){
  if(g.kind==='saw'){chainsaw();return}
  shotsFired++;
  if(g.kind==='blunder'){blunder(g);return}
  const [x0,y0]=muzzlePos,tx=mouse.x,ty=mouse.y,d=Math.hypot(tx-x0,ty-y0);
  throws.push({kind:g.kind,dmg:g.dmg,x0,y0,tx,ty,x:x0,y:y0,t:0,dur:Math.max(.1,d/(g.kind==='harpoon'?520:340)),spin:0});
  if(g.kind==='harpoon'){flashT=.05;boom({lp:2000,dec:.25,vol:.5,thump:140})}else{throwT=.35;boom({lp:700,hp:200,dec:.3,vol:.35})}
}
function impact(r){const {kind,tx:x,ty:y}=r,f=face;
  if(f&&f.state==='live'){const lx=Math.floor((x-f.sx)/f.sc),ly=Math.floor((y-f.sy)/f.sc);
    if(f.p.a(lx,ly)>0){meleeWound(f,lx,ly,kind,x,y);f.stuck.push({kind,lx,ly,seed:ri(0,99)});hitsLanded++;f.hits+=r.dmg;f.flinch=.15;
      boom({lp:400,dec:.15,vol:.6,thump:120});boom({lp:900,dec:.2,vol:.3,dly:.03});
      if(kind==='harpoon')f.yank=.35;
      if(f.hits>=f.hp)explode(f);return}}
  const ci=critterAt(x,y);if(ci>=0){hitsLanded++;killCritter(ci,false);return}
  if(y<VIEW_H&&y>=0){drawStuck(bgc,kind,x,y,ri(0,99));boom({lp:1500,dec:.1,vol:.4,thump:200});for(let k=0;k<5;k++)addP({k:'dust',x,y,vx:rand(-30,30),vy:rand(-40,-5),g:-10,life:rand(.3,.6),s:1,c:'#8a7c6c',floor:999})}
}
function meleeWound(f,lx,ly,kind,sx,sy){
  const hole=(x,y,r)=>{for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){const d=Math.hypot(i,j);if(d<=r*.55+.3)dset(f,x+i,y+j,[18,0,0]);else if(d<=r+.8)dset(f,x+i,y+j,[110,6,6])}};
  const spat=(x,y,n,R)=>{for(let k=0;k<n;k++){const a=rand(0,TAU),d=Math.pow(Math.random(),1.5)*R;dset(f,Math.round(x+Math.cos(a)*d),Math.round(y+Math.sin(a)*d),pick(DBLOOD))}};
  const gush=(x,y,rate,dur)=>emitters.push({f,lx:x,ly:y,dir:Math.atan2(y-FCY,x-FCX)-.5,t:0,dur,rate,acc:0});
  if(kind==='spear'){hole(lx,ly,2);spat(lx,ly,20,8);gush(lx,ly,110,.9);blood(sx,sy,18,[40,140]);f.drips.push({x:lx,y:ly+2,left:ri(14,30),acc:0,sp:.05})}
  else if(kind==='trident'){for(const o of [-4,0,4]){hole(lx+o,ly,1.3);spat(lx+o,ly,8,5);gush(lx+o,ly,45,.6);f.drips.push({x:lx+o,y:ly+2,left:ri(8,22),acc:0,sp:rand(.05,.1)})}blood(sx,sy,24,[40,150])}
  else if(kind==='axe'){const a=-.6;for(let d=-7;d<=7;d+=.5){const x=Math.round(lx+Math.cos(a)*d),y=Math.round(ly+Math.sin(a)*d);dset(f,x,y,[25,0,0]);dset(f,x,y+1,[140,10,10]);dset(f,x,y-1,[140,10,10]);if(Math.random()<.4)dset(f,x,y+2,[210,120,120])}
    spat(lx,ly,30,12);blood(sx,sy,34,[60,200],{dir:-Math.PI/2-.4,cone:.9,up:30});gibAt(f,lx,ly,sx,sy,3);for(let k=0;k<3;k++)f.drips.push({x:lx+ri(-6,6),y:ly+ri(1,4),left:ri(8,24),acc:0,sp:rand(.04,.1)})}
  else if(kind==='harpoon'){hole(lx,ly,1.8);spat(lx,ly,14,7);for(const s of [-1,1])dset(f,lx+s*3,ly+2,[90,0,0]);blood(sx,sy,14,[40,120]);
    for(let k=0;k<16;k++)addP({k:'streak',x:sx,y:sy,vx:rand(-50,50),vy:rand(60,180),g:200,life:2,s:1,c:pick(BRIGHT),floor:rand(146,166)})}
  f.dirty=true;
}
function blunder(g){
  flashT=.08;boom({lp:1600,dec:.8,vol:1,thump:70});boom({lp:5000,hp:2000,dec:.15,vol:.3});shake=Math.max(shake,.12);
  const [mx,my]=muzzlePos;for(let k=0;k<5;k++)mist(mx+rand(-6,6),my+rand(-8,0),5,rand(25,40),'#8a8478',.55,1.6);
  const f=face,live=f&&f.state==='live';let n=0;
  for(let i=0;i<14;i++){const a=rand(0,TAU),r=Math.sqrt(Math.random())*g.spread,px=mouse.x+Math.cos(a)*r,py=mouse.y+Math.sin(a)*r;
    if(live){const lx=Math.floor((px-f.sx)/f.sc),ly=Math.floor((py-f.sy)/f.sc);if(f.p.a(lx,ly)>0){n++;wound(f,lx,ly,3);blood(px,py,5,[50,160],{up:30,pal:BRIGHT});
      if(Math.random()<.4)addP({k:'gib',x:px,y:py,vx:rand(-90,90),vy:rand(-150,-40),g:420,life:3,s:1,c:pick(['#8a8a90','#5a5a60','#b0a070']),floor:rand(148,166)});continue}}
    const ci=critterAt(px,py);if(ci>=0){killCritter(ci,false);continue}miss(px,py)}
  if(n){hitsLanded++;f.hits+=n>=7?2:1;f.flinch=.15;mist(mouse.x,mouse.y,4,26,'#a01818',.45,.6);boom({lp:700,dec:.12,vol:.35});
    gibAt(f,Math.floor((mouse.x-f.sx)/f.sc),Math.floor((mouse.y-f.sy)/f.sc),mouse.x,mouse.y,3);if(f.hits>=f.hp)explode(f)}

function chainsaw(){
  sawSound();recoil=.3;const f=face;
  if(f&&f.state==='live'){const lx=Math.floor((mouse.x-f.sx)/f.sc),ly=Math.floor((mouse.y-f.sy)/f.sc);
    if(f.p.a(lx,ly)>0){const from=sawLast||[lx,ly];carve(f,from[0],from[1],lx,ly);sawLast=[lx,ly];
      for(let k=0;k<6;k++)addP({k:'drop',x:mouse.x,y:mouse.y,vx:rand(-90,90),vy:rand(-220,-80),g:380,life:rand(3,5),s:Math.random()<.3?2:1,c:pick(BRIGHT),floor:rand(146,166)});
      if(Math.random()<.25)gibAt(f,lx,ly,mouse.x,mouse.y,1);if(Math.random()<.2)mist(mouse.x,mouse.y,2,16,'#b02020',.4,.4);
      sawTick+=.05;if(sawTick>=.2){sawTick=0;shotsFired++;hitsLanded++;f.hits++;f.flinch=.06;boom({lp:600,dec:.1,vol:.25});if(f.hits>=f.hp)explode(f)}return}}
  sawLast=null;const ci=critterAt(mouse.x,mouse.y);if(ci>=0){shotsFired++;hitsLanded++;killCritter(ci,false);return}
  if(mouse.y<VIEW_H&&Math.random()<.5)addP({k:'spark',x:mouse.x,y:mouse.y,vx:rand(-80,80),vy:rand(-120,-30),g:300,life:.3,s:1,c:'#ffd040',floor:999});
}
function carve(f,x0,y0,x1,y1){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*2));
  for(let i=0;i<=n;i++){const u=i/n,x=Math.round(x0+(x1-x0)*u),y=Math.round(y0+(y1-y0)*u);
    dset(f,x,y,[25,0,0]);dset(f,x+1,y,[60,0,0]);for(const [ox,oy] of [[0,-1],[0,1],[-1,0],[1,1]])if(Math.random()<.7)dset(f,x+ox,y+oy,[140,10,10]);if(Math.random()<.25)dset(f,x+ri(-2,2),y+ri(-2,2),[210,120,120])}
  if(Math.random()<.15)f.drips.push({x:x1,y:y1+2,left:ri(6,18),acc:0,sp:rand(.05,.1)});f.dirty=true}
function sawSound(){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(rand(85,115),t);
  g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g);g.connect(master);o.start(t);o.stop(t+.08);boom({lp:1800,dec:.06,vol:.12})}
function drawStuck(g,kind,x,y,seed=0){x=Math.round(x);y=Math.round(y);
  const shaft=(len,w0,w1,col,ux,uy)=>{g.fillStyle=col;for(let i=0;i<len;i++){const w=Math.max(1,Math.round(w0+(w1-w0)*i/len));g.fillRect(Math.round(x+ux*i-w/2),Math.round(y+uy*i-w/2),w,w)}};
  const dx=(x-160)*.4+(seed%9-4)*2,dy=30,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  g.fillStyle='#1a0000';g.fillRect(x-1,y-1,3,3);
  if(kind==='spear'){shaft(20,1,3,'#7a5028',ux,uy);g.fillStyle='#4a2e14';g.fillRect(Math.round(x+ux*4)-1,Math.round(y+uy*4)-1,3,2)}
  else if(kind==='trident'){g.fillStyle='#1a0000';g.fillRect(x-5,y-1,2,2);g.fillRect(x+4,y-1,2,2);g.fillStyle='#9aa0aa';g.fillRect(x-5,y+1,11,2);g.fillStyle='#d0d4da';g.fillRect(x-5,y+1,11,1);shaft(20,1,3,'#b08a40',ux,uy)}
  else if(kind==='axe'){g.fillStyle='#6a7078';g.fillRect(x-4,y-1,8,3);g.fillStyle='#d0d4da';g.fillRect(x-4,y-1,8,1);const s=seed%2?1:-1;shaft(17,2,3,'#7a4a20',.55*s,.83)}
  else if(kind==='harpoon'){shaft(13,1,2,'#a8acb4',ux,uy);g.fillStyle='#d0d4da';g.fillRect(x-3,y+1,2,1);g.fillRect(x+2,y+1,2,1)}
}
function drawThrows(){for(const r of throws){const u=Math.min(1,r.t/r.dur),x=Math.round(r.x),y=Math.round(r.y);
  if(r.kind==='harpoon'){ctx.strokeStyle='#8a6a3a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(muzzlePos[0],muzzlePos[1]);ctx.lineTo(x,y);ctx.stroke()}
  if(r.kind==='axe'){ctx.save();ctx.translate(x,y);ctx.rotate(r.spin);const s=1.6-u*.8;ctx.scale(s,s);ctx.fillStyle='#7a4a20';ctx.fillRect(-1,-1,2,12);ctx.fillStyle='#9aa0a8';ctx.fillRect(-5,-3,6,5);ctx.fillStyle='#e0e4ea';ctx.fillRect(-5,-3,1,5);ctx.restore();continue}
  const dx=r.tx-r.x0,dy=r.ty-r.y0,d=Math.hypot(dx,dy)||1,len=(r.kind==='harpoon'?10:20)*(1-u*.6);
  ctx.strokeStyle=r.kind==='spear'?'#7a5028':r.kind==='trident'?'#b08a40':'#a8acb4';ctx.lineWidth=Math.max(1,2-u);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-dx/d*len,y-dy/d*len);ctx.stroke();
  ctx.fillStyle='#d0d4da';ctx.fillRect(x-1,y-1,2,2);if(r.kind==='trident'){ctx.fillRect(x-3,y,1,2);ctx.fillRect(x+2,y,1,2)}}}

/* ---------- input ---------- */
function toGame(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointermove',e=>{const p=toGame(e);mouse.x=p.x;mouse.y=p.y;mouse.in=true});
cv.addEventListener('pointerleave',()=>{mouse.in=false;firing=false});
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const p=toGame(e);mouse.x=p.x;mouse.y=p.y;mouse.in=true;
  if(state==='title'){startGame();return}
  if(state==='over'){if(overT>1){final?startGame():startLevel(level+1)}return}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}firing=true;fire()});
addEventListener('pointerup',()=>{firing=false;sawLast=null});addEventListener('pointercancel',()=>firing=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='6')switchGun(+e.key-1);else if(e.key==='m'||e.key==='M')toggleMute()});
const rackBtns=[...document.querySelectorAll('.rack [data-gun]')],muteBtn=document.getElementById('mute');
rackBtns.forEach(b=>b.addEventListener('click',()=>{audio();switchGun(+b.dataset.gun)}));
function setRack(){rackBtns.forEach((b,i)=>{b.innerHTML='<span class="k">'+(i+1)+'</span>'+GUNS[i].label})}
function syncRack(){rackBtns.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===cur)))}
function toggleMute(){muted=!muted;muteBtn.setAttribute('aria-pressed',String(muted));muteBtn.textContent=muted?'Sound off':'Sound on'}
muteBtn.addEventListener('click',()=>{audio();toggleMute()});

/* ---------- update ---------- */
function update(dt){
  T+=dt;cooldown-=dt;recoil=Math.max(0,recoil-dt*8);flashT-=dt;switchT=Math.max(0,switchT-dt);shake-=dt;redFlash-=dt;pumpT+=dt;throwT=Math.max(0,throwT-dt);
  if(state==='over')overT+=dt;
  if(state==='play'&&firing&&GUNS[cur].auto&&cooldown<=0)fire();
  if(state==='play'&&!face&&idx<order.length){introT-=dt;if(introT<=0)face=buildFace(order[idx],LEVELS[level].hp)}
  if(state==='play'){spawnT-=dt;if(spawnT<=0){spawnCritter();const L=LEVELS[level];spawnT=rand(L.spawn[0],L.spawn[1])}}
  for(let i=critters.length-1;i>=0;i--){const c=critters[i];c.t+=dt;c.x+=c.vx*dt;
    c.y=c.d.fly?c.by+Math.sin(c.t*4+c.ph)*8:c.by-(frameOf(c)?1:0);
    if(c.x<-40||c.x>W+40)critters.splice(i,1)}
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.t+=dt;const u=Math.min(1,r.t/r.dur);
    r.x=r.x0+(r.tx-r.x0)*u;r.y=r.y0+(r.ty-r.y0)*u-Math.sin(u*Math.PI)*6;
    mist(r.x,r.y,1.5,10,'#6a6460',.45,.7);
    if(u>=1){rockets.splice(i,1);detonate(r.tx,r.ty)}}
  for(let i=throws.length-1;i>=0;i--){const r=throws[i];r.t+=dt;const u=Math.min(1,r.t/r.dur);r.x=r.x0+(r.tx-r.x0)*u;r.y=r.y0+(r.ty-r.y0)*u-(r.kind==='harpoon'?0:Math.sin(u*Math.PI)*14);r.spin+=dt*22;
    if(u>=1){throws.splice(i,1);impact(r)}}
  for(let i=burnQ.length-1;i>=0;i--){burnQ[i].t-=dt;if(burnQ[i].t<=0){const b=burnQ.splice(i,1)[0];burnAt(b.x,b.y)}}
  const f=face;
  if(state==='play'&&f){
    f.t+=dt;f.flinch-=dt;
    if(f.state==='enter'&&f.t>.4){f.state='live';f.t=0}
    else if(f.state==='live'){f.left-=dt;if(f.left<=0){f.left=0;f.state='escape';f.t=0;f.burns=[];laugh();msg(f.def.boss?'SHE GOT AWAY!':'GOT AWAY!','#e0402a',16,58)}}
    else if(f.state==='escape'&&f.t>.8)nextFace();
    else if(f.state==='dead'&&f.t>(f.def.boss?2.6:1.5))nextFace();
  }
  const cf=state==='play'?face:null;
  if(cf&&cf.state!=='dead'){
    let yo=0,jx=0,jy=0;
    if(cf.state==='enter')yo=Math.pow(1-Math.min(1,cf.t/.4),3)*150;
    if(cf.state==='escape')yo=cf.t*cf.t*260;
    if(cf.flinch>0){jx=ri(-2,2);jy=ri(-1,1)}
    if(cf.state==='live'&&cf.left<3)jx+=Math.round(Math.sin(T*40));
    if(cf.yank>0){cf.yank-=dt;yo+=Math.sin(Math.max(0,cf.yank)/.35*Math.PI)*10}
    if(cf.def.boss){const enr=cf.hits>cf.hp/2;cf.sx=Math.round(160-FW*cf.sc/2+Math.sin(T*(enr?1.7:.9))*28)+jx;cf.sy=Math.round(-2+yo+jy);
      if(cf.state==='live'){cf.spawnT=(cf.spawnT===undefined?2:cf.spawnT)-dt;if(cf.spawnT<=0){cf.spawnT=enr?1.2:2.2;const d=CRIT.spider,y=rand(d.gy[0],d.gy[1]);
        critters.push({type:'spider',d,x:cf.sx+FW*cf.sc/2-7,y,by:y,vx:(Math.random()<.5?1:-1)*rand(80,120),t:0,ph:0})}}}
    else{cf.sx=FX+jx;cf.sy=Math.round(FY+yo+jy)}
    for(let i=cf.drips.length-1;i>=0;i--){const d=cf.drips[i];d.acc+=dt;
      while(d.acc>d.sp){d.acc-=d.sp;const nx=d.x+(Math.random()<.1?ri(-1,1):0),ny=d.y+1;
        if(d.left<=0||cf.p.a(nx,ny)===0){if(d.left>0)addP({k:'drop',x:cf.sx+d.x*cf.sc,y:cf.sy+d.y*cf.sc,vx:0,vy:10,g:320,life:4,s:1,c:BLOOD[1],floor:rand(150,166)});cf.drips.splice(i,1);break}
        dset(cf,nx,ny,[120,4,4]);d.x=nx;d.y=ny;d.left--;cf.dirty=true}}
    for(let i=cf.burns.length-1;i>=0;i--){const b=cf.burns[i];b.t-=dt;if(b.t<=0){cf.burns.splice(i,1);continue}
      if(Math.random()<.6)addP({k:'flame',x:cf.sx+b.lx*cf.sc+rand(-2,2),y:cf.sy+b.ly*cf.sc,vx:rand(-8,8),vy:rand(-50,-25),g:-30,life:rand(.25,.45),s:1,floor:999})}
  }
  for(let i=emitters.length-1;i>=0;i--){const em=emitters[i];em.t+=dt;if(em.t>em.dur||em.f.state==='dead'){emitters.splice(i,1);continue}
    em.acc+=em.rate*dt*(.5+.5*Math.sin(em.t*30));
    while(em.acc>=1){em.acc--;const a=em.dir+rand(-.18,.18),s=rand(70,120)*(1-em.t/em.dur*.6);
      addP({k:'drop',x:em.f.sx+em.lx*em.f.sc,y:em.f.sy+em.ly*em.f.sc,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50,g:320,life:rand(3,5),s:1,c:pick(BLOOD),floor:rand(146,166)})}}
  for(let i=P.length-1;i>=0;i--){const q=P[i];q.t+=dt;if(q.t>q.life){P.splice(i,1);continue}
    if(q.k==='mist'){q.r+=q.gr*dt;q.gr*=.96;q.x+=q.vx*dt;q.y+=q.vy*dt;continue}
    if(q.rest)continue;
    q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.y>=q.floor&&q.vy>0){
      if(q.k==='gib'||q.k==='shell'||q.k==='eye'){if(!q.b&&q.vy>60){q.vy*=-.35;q.vx*=.6;q.b=1;q.y=q.floor}else{q.rest=1;q.y=q.floor}}
      else{q.k='drop';q.rest=1;q.y=q.floor;if(Math.random()<.5)q.s++}}
  }
  for(let i=tracers.length-1;i>=0;i--){tracers[i].t+=dt;if(tracers[i].t>.09)tracers.splice(i,1)}
  for(let i=splats.length-1;i>=0;i--){const s=splats[i];s.t+=dt;s.drip=Math.min(30,s.drip+dt*8);if(s.t>s.life)splats.splice(i,1)}
  for(let i=msgs.length-1;i>=0;i--){msgs[i].t+=dt;if(msgs[i].t>msgs[i].life)msgs.splice(i,1)}
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>.9)pops.splice(i,1)}
}

/* ---------- render ---------- */
function txt(s,x,y,size,col,align='left',shadow='#000'){ctx.font=`${size}px "Press Start 2P", monospace`;ctx.textAlign=align;ctx.textBaseline='top';
  if(shadow){ctx.fillStyle=shadow;ctx.fillText(s,x+1,y+1)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function torches(){
  const hell=curTheme==='hell',zoo=curTheme==='zoo',fc=hell?['#1a7a20','#40d040','#b0ff80','#f0fff0']:zoo?['#8a6a10','#ffd040','#fff3a0','#ffffff']:['#b8220e','#ff7a18','#ffd24a','#fff5c0'],gc=hell?'80,255,90':zoo?'255,220,120':'255,110,30';
  for(const tx of [28,292]){const h=rand(0,3);
    ctx.fillStyle=fc[0];ctx.fillRect(tx-4,50,8,6);ctx.fillStyle=fc[1];ctx.fillRect(tx-3,Math.round(46-h),6,8);ctx.fillStyle=fc[2];ctx.fillRect(tx-2,Math.round(49-h),4,5);ctx.fillStyle=fc[3];ctx.fillRect(tx-1,52,2,3);
    ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(tx,50,2,tx,50,55);g.addColorStop(0,`rgba(${gc},${.2+Math.random()*.05})`);g.addColorStop(1,`rgba(${gc},0)`);
    ctx.fillStyle=g;ctx.fillRect(tx-55,0,110,110);ctx.globalCompositeOperation='source-over'}
  if(hell||zoo){const lc=hell?'255,90,20':'80,255,60';ctx.globalCompositeOperation='lighter';const g=ctx.createLinearGradient(0,120,0,VIEW_H);g.addColorStop(0,`rgba(${lc},0)`);g.addColorStop(1,`rgba(${lc},${.14+.06*Math.sin(T*2)})`);
    ctx.fillStyle=g;ctx.fillRect(0,120,W,48);ctx.globalCompositeOperation='source-over'}
}
function drawFace(f,alpha=1){
  if(!f||f.state==='dead')return;
  if(f.dirty){f.dg.putImageData(new ImageData(f.decal.d,FW,FH),0,0);f.dirty=false}
  let al=alpha;if(f.state==='escape')al*=Math.max(0,1-f.t/.8);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,VIEW_H);ctx.clip();
  const sc=f.sc,cx=f.sx+FCX*sc;
  ctx.globalAlpha=al*.45;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(cx,160,30*sc,4,0,0,TAU);ctx.fill();ctx.globalAlpha=al;
  if(f.def.boss){const cy=f.sy+FCY*sc;for(const s of [-1,1])for(let i=0;i<4;i++){const shx=cx+s*44,shy=cy-20+i*14,w=Math.sin(T*3+i*1.3+(s>0?1:0))*5,kx=shx+s*(34+i*10),ky=shy-38+i*10+w,fx=kx+s*(16+i*6),fy=150+i*4;
    for(const [lw,col] of [[5,'#1a0e1e'],[2,'#5a3a66']]){ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(shx,shy);ctx.lineTo(kx,ky);ctx.lineTo(fx,fy);ctx.stroke()}}}
  ctx.drawImage(f.flinch>0?f.tint:f.canvas,f.sx,f.sy,FW*sc,FH*sc);ctx.drawImage(f.dc,f.sx,f.sy,FW*sc,FH*sc);
  for(const st of f.stuck){const X=f.sx+st.lx*sc,Y=f.sy+st.ly*sc;if(st.kind==='harpoon'){ctx.strokeStyle='#8a6a3a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X,Y+10);ctx.quadraticCurveTo(X+8,Y+40,X+(st.seed%30)-15,VIEW_H+4);ctx.stroke()}drawStuck(ctx,st.kind,X,Y,st.seed)}
  ctx.globalCompositeOperation='lighter';
  for(const e of f.eyes){ctx.fillStyle=`rgba(${e.col[0]},${e.col[1]},${e.col[2]},${(.16+.1*Math.sin(T*7))*al})`;ctx.beginPath();ctx.arc(f.sx+(e.x+.5)*sc,f.sy+(e.y+.5)*sc,(e.r+3)*sc,0,TAU);ctx.fill()}
  ctx.restore();
}
function drawParticles(){
  for(const q of P){const fade=q.t>q.life-1?Math.max(0,q.life-q.t):1;
    if(q.k==='mist'){ctx.globalAlpha=q.a*(1-q.t/q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill();continue}
    if(q.k==='flame'){const a=q.t/q.life,c=a<.12?'#fff6c0':a<.3?'#ffd040':a<.55?'#ff8a20':a<.8?'#d83a10':'#4a4038',s=Math.round(q.s+a*5);
      ctx.globalAlpha=a>.8?(1-a)*4:1;ctx.fillStyle=c;ctx.fillRect(Math.round(q.x-s/2),Math.round(q.y-s/2),s,s);continue}
    ctx.globalAlpha=fade;
    if(q.k==='streak'&&!q.rest){ctx.strokeStyle=q.c;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*.03,q.y-q.vy*.03);ctx.stroke();continue}
    const x=Math.round(q.x),y=Math.round(q.y);
    if(q.k==='eye'){ctx.fillStyle='#eee6d0';ctx.fillRect(x-1,y-1,4,4);ctx.fillStyle=q.c;ctx.fillRect(x,y,2,2);ctx.fillStyle='#000';ctx.fillRect(x+1,y,1,1);ctx.fillStyle='#8a0000';ctx.fillRect(x-1,y+3,2,1);continue}
    ctx.fillStyle=q.c;if(q.k==='shell')ctx.fillRect(x,y,2,1);else ctx.fillRect(x,y,q.s,q.s);
  }
  ctx.globalAlpha=1;
}
function drawRockets(){for(const r of rockets){const u=Math.min(1,r.t/r.dur),s=Math.max(2,Math.round(5-3*u)),x=Math.round(r.x),y=Math.round(r.y);
  ctx.fillStyle='#ffb020';ctx.fillRect(x-1,y+s-1,2,3);ctx.fillStyle='#d8d4c4';ctx.fillRect(x-Math.floor(s/2),y-Math.floor(s/2),s,s);ctx.fillStyle='#7a2010';ctx.fillRect(x-Math.floor(s/2),y-Math.floor(s/2),s,1)}}
function drawGun(){
  const g=GUNS[cur],bob=Math.sin(T*2)*1.5,sw=(switchT/.3)*60;
  const gx=Math.round(188+(mouse.x-160)*.12)+(g.kind==='saw'&&firing?ri(-1,1):0),gy=Math.round(VIEW_H-60+bob+recoil*g.kick+sw+(throwT/.35)*70+(mouse.y-100)*.04);
  ctx.drawImage(sprites[cur][0],gx-40,gy);
  if(g.name==='SHOTGUN'){const po=pumpT>.3&&pumpT<.6?Math.round(Math.sin((pumpT-.3)/.3*Math.PI)*8):0;ctx.drawImage(pumpSprite,gx-40,gy+po)}
  muzzlePos=[gx-40+g.muzzle[0],gy+g.muzzle[1]];
  if(g.kind==='saw'){const off=firing?Math.floor(T*40)%3:0;ctx.fillStyle='#2a2a2e';for(let y=1;y<30;y+=3){ctx.fillRect(gx-6,gy+y+off,1,2);ctx.fillRect(gx+5,gy+y+off,1,2)}}
  if(g.flame){const [x,y]=muzzlePos;ctx.fillStyle=Math.random()<.5?'#60a0ff':'#ffb020';ctx.fillRect(x-1,y-2-ri(0,2),2,2)}
  if(flashT>0&&g.flash){const [x,y]=muzzlePos,s=g.flash+ri(-1,2);
    ctx.globalCompositeOperation='lighter';const gr=ctx.createRadialGradient(x,y,1,x,y,40);gr.addColorStop(0,'rgba(255,200,90,.35)');gr.addColorStop(1,'rgba(255,200,90,0)');ctx.fillStyle=gr;ctx.fillRect(x-40,y-40,80,80);ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#ff6a10';ctx.fillRect(x-s+2,y-s+2,2,2);ctx.fillRect(x+s-4,y-s+2,2,2);ctx.fillStyle='#ffb020';ctx.fillRect(x-s,y-2,s*2,4);ctx.fillRect(x-2,y-s,4,s*2);
    ctx.fillStyle='#fff3a0';ctx.fillRect(x-s/2,y-1,s,2);ctx.fillRect(x-1,y-s/2,2,s)}
}
function drawHud(){
  ctx.drawImage(hudBg,0,VIEW_H);
  const y1=VIEW_H+8,y2=VIEW_H+19;
  {const gn=GUNS[cur].name,big=gn.length<=9;txt(gn,8,big?y1:y1+1,big?8:6,'#f2b632')}
  for(let i=0;i<GUNS.length;i++)txt(String(i+1),8+i*12,y2,8,i===cur?'#f2b632':'#5c4f42');
  const f=face;
  txt(f?f.name:state==='play'?`LEVEL ${LEVELS[level].num}`:state==='title'?'READY?':'ROUND OVER',94,y1,8,'#e0402a');
  const left=f?f.left:(state==='play'?10:0),frac=left/(f?f.time:10);
  ctx.fillStyle='#050303';ctx.fillRect(94,y2,84,7);
  ctx.fillStyle=left<3&&Math.floor(T*6)%2?'#ffe060':'#c3121a';ctx.fillRect(95,y2+1,Math.round(82*frac),5);
  txt(left.toFixed(1),218,y2,8,left<3?'#ffe060':'#dccbb2','right');
  txt('KILLS',230,y1,8,'#8f7c67');txt(`${kills}/${order.length||10}`,312,y1,8,'#dccbb2','right');
  txt('PTS',230,y2,8,'#8f7c67');txt(String(score).padStart(6,'0'),312,y2,8,'#f2b632','right');
}
function drawCross(){
  if(!mouse.in)return;const x=Math.round(mouse.x),y=Math.round(mouse.y);
  let over=false;if(state==='play'&&face&&face.state==='live')over=face.p.a(Math.floor((mouse.x-face.sx)/face.sc),Math.floor((mouse.y-face.sy)/face.sc))>0;
  if(!over&&state==='play')over=critterAt(mouse.x,mouse.y)>=0;
  ctx.fillStyle='#000';ctx.fillRect(x-7,y-1,5,3);ctx.fillRect(x+3,y-1,5,3);ctx.fillRect(x-1,y-7,3,5);ctx.fillRect(x-1,y+3,3,5);
  ctx.fillStyle=over?'#ff3a2a':'#f2e84a';ctx.fillRect(x-6,y,4,1);ctx.fillRect(x+3,y,4,1);ctx.fillRect(x,y-6,1,4);ctx.fillRect(x,y+3,1,4);ctx.fillRect(x,y,1,1);
  const gg=GUNS[cur],r=gg.spread>=8?gg.spread:gg.rocket?14:0;
  if(r&&state==='play'){for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ctx.fillRect(x+sx*r-(sx>0?2:0),y+sy*r,3,1);ctx.fillRect(x+sx*r,y+sy*r-(sy>0?2:0),1,3)}}
}
function render(){
  ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
  ctx.save();
  if(shake>0&&!RM)ctx.translate(ri(-3,3),ri(-3,3));
  ctx.drawImage(bg,0,0);torches();
  for(const c of critters){const img=c.d.canv[frameOf(c)],x=Math.round(c.x),y=Math.round(c.y);if(c.d.flip&&c.vx<0){ctx.save();ctx.translate(x+c.d.w,y);ctx.scale(-1,1);ctx.drawImage(img,0,0);ctx.restore()}else ctx.drawImage(img,x,y)}
  if(state==='title'){titleFace.sx=FX;titleFace.sy=FY;titleFace.state='live';drawFace(titleFace,.9)}
  else if(state==='play')drawFace(face);
  drawParticles();drawRockets();drawThrows();
  for(const t of tracers){ctx.globalAlpha=1-t.t/.09;ctx.strokeStyle='#fff6c0';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(t.x0,t.y0);ctx.lineTo(t.x1,t.y1);ctx.stroke()}
  ctx.globalAlpha=1;
  if(state!=='title')drawGun();
  ctx.restore();
  for(const s of splats){const a=s.t>s.life-1.5?(s.life-s.t)/1.5:1;ctx.fillStyle=`rgba(110,0,0,${.8*a})`;ctx.beginPath();ctx.arc(s.x,s.y+s.t*3,s.r,0,TAU);ctx.fill();
    ctx.fillRect(s.x-2,s.y+s.t*3,4,s.r+s.drip);ctx.beginPath();ctx.arc(s.x+s.r*.7,s.y+s.t*3-s.r*.5,s.r*.45,0,TAU);ctx.fill()}
  if(redFlash>0){ctx.fillStyle=`rgba(255,30,10,${redFlash*1.6})`;ctx.fillRect(0,0,W,VIEW_H)}
  const L=LEVELS[level];
  if(state==='play'){const bf=face&&face.def.boss;txt(bf?`LV${L.num}  BOSS`:`LV${L.num}  FACE ${Math.min(idx+1,order.length)}/${order.length}`,6,6,8,'#dccbb2');
    if(bf&&face.state!=='dead'){const fr=Math.max(0,1-face.hits/face.hp);txt(face.name,214,4,8,'#e0201a','center');ctx.fillStyle='#050303';ctx.fillRect(154,14,120,6);ctx.fillStyle='#7aff30';ctx.fillRect(155,15,Math.round(118*fr),4)}
    if(!face&&introT>0){txt(`LEVEL ${L.num}`,160,48,16,'#e0201a','center');txt(L.name,160,74,8,'#f2b632','center');if(L.note)txt(L.note,160,88,8,'#e0402a','center')}}
  for(const p of pops){ctx.globalAlpha=Math.max(0,1-p.t/.9);txt(p.s,Math.round(p.x),Math.round(p.y-p.t*16),8,'#ffe060','center')}
  for(const m of msgs){ctx.globalAlpha=Math.min(1,(m.life-m.t)*3);txt(m.s,160,Math.round(m.y-m.t*14),m.size,m.col,'center','#3a0000')}
  ctx.globalAlpha=1;
  if(state==='title'){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,VIEW_H);
    txt('FACE BLAST',162,20,24,'#5a0000','center',null);txt('FACE BLAST',160,18,24,'#e0201a','center',null);
    if(Math.floor(T*2.5)%2)txt('CLICK TO START',160,66,8,'#f2b632','center');
    txt('1 PISTOL  2 SHOTGUN  3 RIFLE',160,90,8,'#dccbb2','center');
    txt('4 UZI  5 ROCKET  6 FLAMER',160,102,8,'#dccbb2','center');
    txt('SHOOT CRITTERS FOR BONUS',160,122,8,'#dccbb2','center');
    txt('3 LEVELS + A FINAL BOSS',160,146,8,'#8f7c67','center')}
  if(state==='over'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,VIEW_H);
    const acc=shotsFired?Math.round(hitsLanded/shotsFired*100):0,c1='#dccbb2';
    if(!final){const N=LEVELS[level+1];txt(`LEVEL ${L.num} CLEAR`,160,18,16,'#e0201a','center');
      txt(`HEADS POPPED  ${kills}/${order.length}`,160,48,8,c1,'center');txt(`CRITTERS  ${levelCritters}`,160,60,8,c1,'center');
      txt(`SCORE  ${score}`,160,72,8,c1,'center');txt(`ACCURACY  ${acc}%`,160,84,8,c1,'center');
      txt('NEXT UP',160,102,8,'#8f7c67','center');txt(N.name,160,114,8,'#f2b632','center');if(N.note)txt(N.note,160,126,8,'#e0402a','center');
      if(overT>1&&Math.floor(T*2.5)%2)txt(`CLICK FOR LEVEL ${level+2}`,160,148,8,'#f2b632','center')}
    else{const TOT=LEVELS.reduce((a,l)=>a+l.faces.length+(l.boss?1:0),0),r=totalKills/TOT;
      const rank=r>=1?'DEMON SLAYER':r>=.8?'HELL RAISER':r>=.5?'GRUNT':r>=.2?'FODDER':'FACE FOOD';
      txt(bossKilled?'YOU WIN!':'GAME OVER',160,16,16,'#e0201a','center');
      txt(`HEADS POPPED  ${totalKills}/${TOT}`,160,42,8,c1,'center');txt(`BOSS  ${bossKilled?'SLAIN':'ESCAPED'}`,160,54,8,c1,'center');txt(`CRITTERS  ${critterKills}`,160,66,8,c1,'center');
      txt(`SCORE  ${score}`,160,78,8,c1,'center');txt(`ACCURACY  ${acc}%`,160,90,8,c1,'center');
      txt('RANK',160,106,8,'#8f7c67','center');txt(rank,160,118,16,'#f2b632','center');
      if(overT>1&&Math.floor(T*2.5)%2)txt('CLICK TO PLAY AGAIN',160,148,8,'#f2b632','center')}}
  drawHud();drawCross();
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}
buildBg('dungeon');
if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
requestAnimationFrame(loop);
})();
</script>
